<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doodlshot</title>
  <link rel="stylesheet" href="style.css">
  <script src="../assets/rough.js"></script>
</head>
<body>

  <!-- Floating Shottr-inspired Toolbar -->
  <div id="toolbar-container">
    <div class="brand-badge">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Doodlshot
    </div>

    <!-- Drawing Tools -->
    <div class="tool-group">
      <button class="tool-btn" id="tool-select" title="Select & Move (V)">
        <svg viewBox="0 0 24 24"><path d="M3 3l7 18 3-7 7-3L3 3z"/></svg>
      </button>
      <button class="tool-btn active" id="tool-arrow" title="Bendable Curved Arrow (A)">
        <svg viewBox="0 0 24 24">
          <path d="M 4 19 Q 8 8 18 5"/>
          <polyline points="11 5 18 5 18 12"/>
        </svg>
      </button>
      <button class="tool-btn" id="tool-oval" title="Hand-drawn Oval (O)">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>
      </button>
      <button class="tool-btn" id="tool-rect" title="Hand-drawn Rectangle (R)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/></svg>
      </button>
      <button class="tool-btn" id="tool-cloud" title="Callout Cloud (C)">
        <svg viewBox="0 0 24 24">
          <path d="M 5.5 17 A 3.5 3.5 0 0 1 5 10 A 4.5 4.5 0 0 1 12 7 A 5 5 0 0 1 19 10 A 3.5 3.5 0 0 1 18.5 17 Z"/>
        </svg>
      </button>
      <button class="tool-btn" id="tool-step" title="Numbered Step Badge 1, 2, 3 (N)">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v8M10 10l2-2"/>
        </svg>
      </button>
      <button class="tool-btn" id="tool-highlighter" title="Highlighter Marker (H)">
        <svg viewBox="0 0 24 24">
          <path d="M14 2l4 4L7 17H3v-4L14 2z"/>
          <path d="M3 22h18"/>
        </svg>
      </button>
      <button class="tool-btn" id="tool-magnifier" title="Magnifier Loupe (M)">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <button class="tool-btn" id="tool-pen" title="Freehand Pen (P)">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
      </button>
      <button class="tool-btn" id="tool-text" title="Hand-drawn Text (T)">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
      </button>
      <button class="tool-btn" id="tool-spotlight" title="Spotlight Focus (S)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="tool-btn" id="tool-pixelate" title="Pixelate Mosaic (X)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7" fill="currentColor"/><rect x="3" y="14" width="7" height="7" fill="currentColor"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button class="tool-btn" id="tool-blur" title="Frosted Blur (B)">
        <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </button>
      <button class="tool-btn" id="tool-erase" title="Smart Erase / Inpaint (E)">
        <svg viewBox="0 0 24 24"><path d="M7 21L20 8l-4-4L3 17l4 4z"/><path d="M18 10l-4-4"/></svg>
      </button>
      <button class="tool-btn" id="tool-crop" title="Crop Canvas (K)">
        <svg viewBox="0 0 24 24">
          <path d="M6 2v14a2 2 0 0 0 2 2h14"/>
          <path d="M18 22V8a2 2 0 0 0-2-2H2"/>
        </svg>
      </button>
    </div>

    <!-- Rich Pastel Palette -->
    <div class="tool-group color-swatch-wrap">
      <div class="color-dot active" data-color="#ff6b6b" style="background: #ff6b6b;" title="Pastel Coral"></div>
      <div class="color-dot" data-color="#ffa94d" style="background: #ffa94d;" title="Pastel Peach"></div>
      <div class="color-dot" data-color="#4dabf7" style="background: #4dabf7;" title="Pastel Soft Sky"></div>
      <div class="color-dot" data-color="#38d9a9" style="background: #38d9a9;" title="Pastel Fresh Mint"></div>
      <div class="color-dot" data-color="#da77f2" style="background: #da77f2;" title="Pastel Lavender"></div>
      <div class="color-dot" data-color="#ffffff" style="background: #ffffff;" title="Frost White"></div>
      <div class="color-dot" data-color="#343a40" style="background: #343a40; border: 1px solid rgba(255,255,255,0.35);" title="Matte Slate"></div>
    </div>

    <!-- Stroke width -->
    <div class="tool-group">
      <button class="tool-btn" id="stroke-thin" title="Thin Stroke (2.5px)" style="font-size: 11px;">1x</button>
      <button class="tool-btn active" id="stroke-medium" title="Medium Stroke (4.5px)" style="font-size: 13px; font-weight: bold;">2x</button>
      <button class="tool-btn" id="stroke-thick" title="Thick Stroke (7px)" style="font-size: 15px; font-weight: 900;">3x</button>
    </div>

    <!-- Studio Framing & Backdrop -->
    <div class="tool-group" id="backdrop-group">
      <button class="tool-btn active backdrop-btn" data-backdrop="none" title="Raw Screenshot (No Frame)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" stroke-dasharray="3 3"/></svg>
      </button>
      <button class="tool-btn backdrop-btn" data-backdrop="sunset" title="Sunset Studio Frame">
        <span class="backdrop-preview" style="background: linear-gradient(135deg, #f093fb, #f5576c);"></span>
      </button>
      <button class="tool-btn backdrop-btn" data-backdrop="ocean" title="Ocean Sky Frame">
        <span class="backdrop-preview" style="background: linear-gradient(135deg, #4facfe, #00f2fe);"></span>
      </button>
      <button class="tool-btn backdrop-btn" data-backdrop="obsidian" title="Obsidian Matte Dark Frame">
        <span class="backdrop-preview" style="background: linear-gradient(135deg, #27272a, #09090b);"></span>
      </button>
      <button class="tool-btn backdrop-btn" data-backdrop="aurora" title="Aurora Pastel Frame">
        <span class="backdrop-preview" style="background: linear-gradient(135deg, #d299c2, #fef9d7);"></span>
      </button>
    </div>

    <!-- Actions -->
    <div class="tool-group" style="border-right: none; padding-left: 6px;">
      <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="action-btn" id="btn-save" title="Save to File (Ctrl+S)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save
      </button>
      <button class="action-btn primary" id="btn-copy" title="Copy to Clipboard & Close (Ctrl+C / Enter)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
    </div>
  </div>

  <!-- Viewport & Canvas -->
  <div id="canvas-viewport">
    <div id="canvas-wrapper">
      <canvas id="editor-canvas"></canvas>
      <textarea id="text-editor-input" rows="1" spellcheck="false"></textarea>
    </div>
  </div>

  <div id="info-badge">
    <span id="badge-dims">800 × 600</span> · <span id="badge-tool">Bendable Arrow</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
